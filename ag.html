:root{
  --zemin:#03061A; --serit:#060B26; --panel:#070D2E; --kutu:#0A1240; --cizgi:#1E2A66; --cizgi2:#2C3B85;
  --yazi:#C9D2FF; --soluk:#7F8BCC; --sonuk:#4F5A99; --camgobegi:#1EBEF0; --vurgu:#D3DA89; --altin:#F3B84B;
  --mono:"JetBrains Mono",Consolas,"Cascadia Mono",ui-monospace,Menlo,monospace;
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--zemin);color:var(--yazi);font:13px/1.45 var(--mono);-webkit-font-smoothing:antialiased;
  display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden}
button,input{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--camgobegi);outline-offset:2px}
.ust{display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap;background:var(--serit);border-bottom:1px solid var(--cizgi);
  padding-top:calc(8px + env(safe-area-inset-top,0px));padding-bottom:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.geri{color:var(--altin);text-decoration:none;font-weight:500;letter-spacing:.06em}
.geri:hover{text-decoration:underline}
.baslik{font-weight:500}.baslik span{color:var(--soluk);font-weight:400}
.sekme{background:none;border:0;border-bottom:1px solid transparent;color:var(--soluk);padding:4px 2px;cursor:pointer}
.sekme[aria-pressed=true]{color:var(--camgobegi);border-bottom-color:var(--camgobegi)}
.sag{margin-inline-start:auto;color:var(--soluk)}
.dil{position:relative}
.dil-b{display:inline-flex;align-items:center;gap:7px;min-height:34px;padding:0 12px;border-radius:999px;border:0;cursor:pointer;background:var(--kutu);box-shadow:inset 0 0 0 1px var(--cizgi);font-size:12px;letter-spacing:.06em}
.dil-b svg{width:14px;height:14px;flex:none}
.dil-b[aria-expanded=true] .ok{transform:rotate(180deg)}
.dil-m{position:absolute;inset-inline-end:0;top:calc(100% + 6px);z-index:40;min-width:200px;padding:6px;border-radius:12px;background:#08103A;box-shadow:0 0 0 1px var(--cizgi2),0 20px 40px -10px rgba(0,0,0,.8);display:grid;gap:2px}
.dil-m button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;min-height:36px;padding:0 10px;border-radius:8px;cursor:pointer;color:var(--soluk);font:500 13.5px/1 var(--mono)}
.dil-m button b{font-weight:500;color:var(--camgobegi);width:22px;font-size:11px}
.dil-m button:hover,.dil-m button:focus-visible{background:rgba(255,255,255,.06);color:#fff}
.dil-m button[aria-checked=true]{background:var(--camgobegi);color:#03061A}.dil-m button[aria-checked=true] b{color:#03061A}
.duzen{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr) minmax(0,340px);min-height:0}
.yan{background:var(--panel);overflow-y:auto;min-width:0;padding-block:14px 24px;padding-inline:14px}
.yan.sol{border-inline-end:1px solid var(--cizgi);padding-inline-start:max(14px,env(safe-area-inset-left,0px))}
.yan.sag2{border-inline-start:1px solid var(--cizgi);padding-inline-end:max(14px,env(safe-area-inset-right,0px))}
.orta{display:grid;grid-template-rows:minmax(0,1fr) auto;min-height:0;min-width:0}
.sahne{position:relative;min-height:0;direction:ltr}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
canvas.surukle{cursor:grabbing}
.alt{display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap;background:var(--serit);border-top:1px solid var(--cizgi);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px))}
button.dg{font-size:12px;background:var(--kutu);border:1px solid var(--cizgi);border-radius:4px;padding:6px 9px;cursor:pointer;white-space:nowrap}
button.dg:hover{border-color:var(--camgobegi)}
#durum{color:var(--soluk);min-width:0}#durum b{color:var(--yazi);font-weight:500}#durum i{font-style:normal;color:var(--vurgu)}
h2{font:500 10.5px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--soluk);margin:0 0 12px;display:flex;justify-content:space-between}
h2 span{color:var(--sonuk);letter-spacing:.06em}
.grup{border-top:1px solid var(--cizgi);padding-top:12px;margin-top:12px}
.grup>p{font:500 10px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--sonuk);margin:0 0 9px}
.cipler{display:flex;flex-wrap:wrap;gap:6px}
.cip{font-size:12px;background:var(--kutu);border:1px solid var(--cizgi);border-radius:999px;padding:6px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.cip:hover{border-color:var(--cizgi2)}
.cip i{width:8px;height:8px;border-radius:50%;background:var(--r,var(--camgobegi));flex:none}
.cip[aria-pressed=true]{border-color:var(--r,var(--camgobegi));background:color-mix(in srgb,var(--r,var(--camgobegi)) 16%,var(--kutu));color:#fff}
.ad-kutu{width:100%;background:var(--kutu);border:1px solid var(--cizgi);border-radius:6px;padding:8px 10px;margin-bottom:10px}
.ad-kutu::placeholder{color:var(--sonuk)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.kay{display:grid;grid-template-columns:84px minmax(0,1fr) 32px;align-items:center;gap:8px;margin:7px 0;color:var(--soluk);font-size:12px}
.kay output{text-align:end;color:var(--yazi)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:3px;background:linear-gradient(90deg,var(--camgobegi) var(--d,50%),var(--cizgi2) var(--d,50%))}
[dir=rtl] input[type=range]::-webkit-slider-runnable-track{background:linear-gradient(270deg,var(--camgobegi) var(--d,50%),var(--cizgi2) var(--d,50%))}
input[type=range]::-moz-range-track{height:3px;background:var(--cizgi2);border-radius:3px}
input[type=range]::-moz-range-progress{height:3px;background:var(--camgobegi);border-radius:3px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#BFF1FF;margin-top:-5px;border:0}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:#BFF1FF;border:0}
.karar{border:1px solid var(--r,var(--cizgi2));border-radius:10px;padding:12px;margin-bottom:14px;background:linear-gradient(180deg,color-mix(in srgb,var(--r,#1EBEF0) 14%,transparent),transparent)}
.karar small{font:500 10px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--soluk)}
.karar .kim{font:400 30px/1.05 var(--serif);color:var(--r,#fff);margin:6px 0 4px}
.karar .icin{color:var(--soluk);font-size:12px;margin-bottom:8px}
.karar ul{list-style:none;margin:0 0 8px;padding:0;display:grid;gap:2px;font-size:12px;color:var(--soluk)}
.karar ul b{font-weight:500}.art{color:#9FF0C8}.eks{color:#FF9DB0}
.karar .uyum{font-size:11.5px;color:var(--sonuk);margin-bottom:10px}
.ver{width:100%;background:var(--r,#1EBEF0);color:#060B26;border:0;border-radius:6px;padding:9px 10px;font-weight:500;cursor:pointer}
.ver:hover{filter:brightness(1.08)}
#liste{list-style:none;margin:0;padding:0;display:grid;gap:7px}
#liste li{border:1px solid var(--cizgi);border-inline-start:3px solid var(--r);border-radius:8px;padding:9px 10px;cursor:pointer;background:var(--kutu)}
#liste li.gosterilen{border-color:var(--r)}
.r1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.r1 .ad{color:var(--r);font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r1 .sira{color:var(--sonuk);margin-inline-end:6px;font-weight:400}
.r1 .puan{font-variant-numeric:tabular-nums}
li.kazanan .r1 .puan{color:var(--r)}
.cub{position:relative;height:4px;background:var(--cizgi);border-radius:4px;margin:7px 0;direction:ltr}
.cub i{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--r);width:0;transition:width .25s}
.cub b{position:absolute;top:-3px;width:2px;height:10px;background:#fff;opacity:.5}
.r2{display:flex;justify-content:space-between;font-size:11px;color:var(--sonuk)}
.isler{display:grid;gap:4px;margin-top:6px}
.is{display:grid;grid-template-columns:8px minmax(0,1fr) auto;align-items:center;gap:7px;font-size:11.5px;color:var(--yazi)}
.is i{width:8px;height:8px;border-radius:2px;background:var(--d)}
.is span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.is em{font-style:normal;color:var(--sonuk);font-variant-numeric:tabular-nums}
.is .ilerle{grid-column:2/4;height:2px;background:var(--cizgi);border-radius:2px;overflow:hidden}
.is .ilerle u{display:block;height:100%;background:var(--d);text-decoration:none}
.lejant{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:12px;font-size:11px;color:var(--sonuk)}
.not{margin-top:12px;font-size:11.5px;color:var(--sonuk);line-height:1.5}
@media (max-width:1100px){
  body{display:block;overflow:auto;height:auto}
  .duzen{grid-template-columns:minmax(0,1fr)}
  .orta{order:-1;grid-template-rows:auto auto}
  .sahne{height:clamp(300px,56vw,620px)}
  .yan{overflow:visible;border:0!important;border-top:1px solid var(--cizgi)!important;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
}
</style>

        var ww=w[j*ni+i],gu=Math.abs(ww)/wmax,ka=Math.abs(ww*ain[i])/cmax,a=.14+.55*Math.pow(gu,.9)+.35*ka,lv=Math.min(11,Math.floor(a*12)),k;
        if(l===L_-1&&ww>0)k=24+j*12+lv;
        else if(l===0&&ww>0&&i<NT)k=24+i*12+lv;
        else if(l===0&&ww>0&&i>=NT+6+NK)k=24+(i-6-NK)*12+lv;
        else k=lv+(ww<0?12:0);
        if(!kova[k])kova[k]=new Path2D();bez(kova[k],P0[i][0],P0[i][1],P1[j][0],P1[j][1]);
      }
      for(var s2=0;s2<kova.length;s2++){
        var idx=s2<12?s2+12:s2<24?s2-12:s2;if(!kova[idx])continue;
        var al=((idx%12)+.5)/12;
        if(idx<12){c.strokeStyle='rgba('+Math.round(18+50*al)+','+Math.round(150+78*al)+',248,'+(.22+.68*al)+')';}
        else if(idx<24)c.strokeStyle='rgba(196,64,232,'+(.08+.4*al)+')';
        else{var gr=Math.floor((idx-24)/12),rgb=l===L_-1?SIS_RGB[gr]:(gr<NT?DEP_RGB[gr]:SIS_RGB[gr-NT]);c.strokeStyle=rgba(rgb,.2+.75*al);}
        c.stroke(kova[idx]);
      }
    }
  } else if(J){
    var P0g=D.dugum[0],P1g=D.dugum[L_],jm=1e-6;for(i=0;i<NIN;i++)for(j=0;j<NS;j++)if(Math.abs(J[i][j])>jm)jm=Math.abs(J[i][j]);
    for(i=0;i<NIN;i++)for(j=0;j<NS;j++){var v=J[i][j]/jm,p2=new Path2D();bez(p2,P0g[i][0],P0g[i][1],P1g[j][0],P1g[j][1]);
      c.strokeStyle=v>=0?rgba(SIS_RGB[j],.06+.9*Math.abs(v)):'rgba(196,64,232,'+(.05+.6*Math.abs(v))+')';c.stroke(p2);}
  }
  D.panel.forEach(function(p){
    var l=p.l,P=D.dugum[l],a=akt[l],n=S[l];
    c.textBaseline='alphabetic';c.textAlign='left';
    var bas=l===0?[L('c_giris'),L('noron')+': '+n,L('c_akt')+': Linear']:l===L_?[L('c_cikis'),L('noron')+': '+n,L('c_akt')+': '+ACT[l]+'  '+L('c_tikla')]:[L('c_gizli')+' '+l+' ('+n+')',L('noron')+': '+n,L('c_akt')+': '+ACT[l]+'  '+L('c_tikla')];
    c.font='500 15px '+FONT;c.fillStyle='#C9D2FF';c.fillText(bas[0],p.x+16,30);
    c.font='400 13px '+FONT;c.fillStyle='#8F9BDC';c.fillText(bas[1],p.x+16,50);c.fillText(bas[2],p.x+16,68);
    var mx=1e-6;for(var i=0;i<n;i++)if(Math.abs(a[i])>mx)mx=Math.abs(a[i]);
    for(i=0;i<n;i++){
      var q=P[i],v,rk;
      if(l===0){
        v=a[i];rk=girdiRengi(i)||'#1EBEF0';
        var bx=q[0]-108,by=q[1]-9,bw=74,bh=18,h=gecmis[i];
        c.strokeStyle='rgba(70,84,150,.6)';c.lineWidth=px;c.strokeRect(bx,by,bw,bh);
        c.beginPath();for(var k=0;k<GECMIS;k++){var val=h[(gecmisUc+k)%GECMIS],xx=bx+2+k/(GECMIS-1)*(bw-4),yy=by+bh-2-val*(bh-4);k?c.lineTo(xx,yy):c.moveTo(xx,yy);}
        c.strokeStyle=girdiRengi(i)||'#8FE6FF';c.lineWidth=1.1;c.stroke();
        c.font='400 12px '+FONT;c.textAlign='right';c.textBaseline='middle';
        var aktif=v>.5&&(i<NT||(i>=NT+6&&i<NT+6+NK)||i===NT+3||i===NT+4);
        if(aktif){var tw=c.measureText(GIRDI_AD[i]).width;c.fillStyle=girdiRengi(i)||'#D3DA89';c.fillRect(bx-14-tw,q[1]-8,tw+8,16);c.fillStyle='#070B26';}
        else c.fillStyle=girdiRengi(i)?(v>.02?rk:rgba(hexRgb(rk),.55)):(v>.02?'#C9D2FF':'#5D69A8');
        c.fillText(GIRDI_AD[i],bx-10,q[1]);
        c.beginPath();c.arc(q[0],q[1],10,0,6.283);c.fillStyle='rgba(8,30,70,'+(.6+.4*v)+')';c.fill();c.lineWidth=1.8;c.strokeStyle=rk;c.stroke();
        if(v>.4){c.beginPath();c.arc(q[0],q[1],14,0,6.283);c.strokeStyle=rgba(hexRgb(rk),.35*v);c.lineWidth=3;c.stroke();}
        c.font='500 9px '+FONT;c.textAlign='center';c.fillStyle='#E8FBFF';c.fillText(v.toFixed(1),q[0],q[1]+.5);
      } else if(l===L_){
        v=a[i];rk=SIS[i].renk;
        c.beginPath();c.arc(q[0],q[1],12,0,6.283);c.fillStyle='rgba(8,24,60,.95)';c.fill();c.lineWidth=2;c.strokeStyle=rk;c.stroke();
        if(i===kaz){c.beginPath();c.arc(q[0],q[1],18,0,6.283);c.strokeStyle=rgba(SIS_RGB[i],.55);c.lineWidth=2.5;c.stroke();}
        c.font='500 9px '+FONT;c.textAlign='center';c.textBaseline='middle';c.fillStyle='#E8FBFF';c.fillText(say(v),q[0],q[1]+.5);
        c.font='400 14px '+FONT;c.textAlign='left';var ad=SIS[i].kod;
        if(i===kaz){var tw2=c.measureText(ad).width;c.fillStyle=rk;c.fillRect(q[0]+24,q[1]-10,tw2+10,20);c.fillStyle='#070B26';c.fillText(ad,q[0]+29,q[1]+.5);}
        else{c.fillStyle=rk;c.fillText(ad,q[0]+26,q[1]+.5);}
        if(i===gosterilen&&i!==kaz){c.strokeStyle=rk;c.lineWidth=1;c.strokeRect(q[0]+22,q[1]-11,c.measureText(ad).width+12,22);}
        if(isler[i].length){c.font='400 11px '+FONT;c.fillStyle='rgba(201,210,255,.7)';c.fillText(isler[i].length+' '+L('is')+' · '+L('yuk')+' '+Math.round(xSimdi[NT+6+NK+i]*100)+'%',q[0]+26,q[1]+20);}
      } else {
        v=k01(Math.abs(a[i])/mx);var kr=['#E046E9','#D85CF0','#C46CF2','#B07CF4','#9C8CF6','#8C9CF8'][Math.min(l-1,5)];
        c.beginPath();c.arc(q[0],q[1],5.2,0,6.283);c.fillStyle=v>.05?kr:'#2A1E55';c.globalAlpha=.35+.65*v;c.fill();c.globalAlpha=1;
        c.lineWidth=1.2;c.strokeStyle='#26B7D9';c.stroke();
        c.font='400 9.5px '+FONT;c.textAlign='left';c.textBaseline='middle';c.fillStyle='#9AA6E6';c.fillText('H'+(i+1),q[0]-16,q[1]+11);
      }
    }
  });
  c.textBaseline='alphabetic';
}

// ---------- tuval etkileşimi ----------
function dunya(ex,ey){return [(ex-kam.x)/kam.s,(ey-kam.y)/kam.s];}
var isaret={},surukle=null,tasindi=false;
cv.addEventListener('pointerdown',function(e){cv.setPointerCapture(e.pointerId);isaret[e.pointerId]=[e.offsetX,e.offsetY];tasindi=false;
  surukle=Object.keys(isaret).length===1?{x:e.offsetX,y:e.offsetY,kx:kam.x,ky:kam.y}:null;cv.classList.add('surukle');});
cv.addEventListener('pointermove',function(e){if(!isaret[e.pointerId])return;var ids=Object.keys(isaret);
  if(ids.length===2){var a=isaret[ids[0]],b=isaret[ids[1]],d0=Math.hypot(a[0]-b[0],a[1]-b[1]);isaret[e.pointerId]=[e.offsetX,e.offsetY];a=isaret[ids[0]];b=isaret[ids[1]];
    var d1=Math.hypot(a[0]-b[0],a[1]-b[1]);if(d0>0)yakinlas((a[0]+b[0])/2,(a[1]+b[1])/2,d1/d0);tasindi=true;return;}
  isaret[e.pointerId]=[e.offsetX,e.offsetY];if(surukle){var dx=e.offsetX-surukle.x,dy=e.offsetY-surukle.y;if(Math.abs(dx)+Math.abs(dy)>4)tasindi=true;kam.x=surukle.kx+dx;kam.y=surukle.ky+dy;}});
cv.addEventListener('pointerup',function(e){var tek=Object.keys(isaret).length===1;delete isaret[e.pointerId];cv.classList.remove('surukle');if(tek&&!tasindi)tikla(e.offsetX,e.offsetY);surukle=null;});
cv.addEventListener('pointercancel',function(e){delete isaret[e.pointerId];surukle=null;});
cv.addEventListener('wheel',function(e){e.preventDefault();yakinlas(e.offsetX,e.offsetY,Math.exp(-e.deltaY*.0015));},{passive:false});
cv.addEventListener('dblclick',sigdir);
function yakinlas(ex,ey,k){var s2=Math.min(6,Math.max(.08,kam.s*k));k=s2/kam.s;kam.x=ex-(ex-kam.x)*k;kam.y=ey-(ey-kam.y)*k;kam.s=s2;}
function tikla(ex,ey){
  var p=dunya(ex,ey),L_=S.length-1,P=D.dugum[0],i;
  for(i=0;i<NIN;i++)if(Math.hypot(p[0]-P[i][0],p[1]-P[i][1])<14||(p[0]>P[i][0]-PW_GIR+20&&p[0]<P[i][0]&&Math.abs(p[1]-P[i][1])<8)){girdiTikla(i);return;}
  var Po=D.dugum[L_];for(i=0;i<NS;i++)if(Math.abs(p[1]-Po[i][1])<16&&p[0]>Po[i][0]-16&&p[0]<Po[i][0]+PW_CIK-30){if(gosterilen===i&&sabit)sabit=false;else{gosterilen=i;sabit=true;}kararPanel();return;}
  for(var k=0;k<D.panel.length;k++){var pn=D.panel[k];if(p[0]>=pn.x&&p[0]<=pn.x+pn.w&&p[1]>=pn.y&&p[1]<=pn.y+pn.h){
    if(pn.l>0&&p[1]<84){var n=AKT_SIRA.indexOf(ACT[pn.l]);ACT[pn.l]=AKT_SIRA[(n+1)%AKT_SIRA.length];yapiDegisti(true);return;}
    if(pn.l>0&&pn.l<L_){secKatman=pn.l;durum();return;}}}
}
function girdiTikla(i){
  if(i<NT)gorev.tur=i;else if(i>=NT+6&&i<NT+6+NK)gorev.kaynak=i-NT-6;
  else if(i===NT+3)gorev.yerel=gorev.yerel?0:1;else if(i===NT+4)gorev.internet=gorev.internet?0:1;
  else if(i<NT+6){var key=['aciliyet','zorluk','risk',null,null,'uzunluk'][i-NT],st=[0,.25,.5,.75,1],en=0;for(var k=0;k<5;k++)if(Math.abs(st[k]-gorev[key])<Math.abs(st[en]-gorev[key]))en=k;gorev[key]=st[(en+1)%5];}
  else return;
  hazirNo=-1;sabit=false;girdiDegisti();
}
function canliAyarla(v){canli=v;$('canli').setAttribute('aria-pressed',v);if(!v)formu();}
$('canli').onclick=function(){canliAyarla(!canli);sabit=false;};
$('calis').onclick=function(){calis=!calis;this.setAttribute('aria-pressed',calis);};
$('calis').setAttribute('aria-pressed',calis);
$('gizle').onclick=function(){gizli=!gizli;this.setAttribute('aria-pressed',gizli);yerlesim();sigdir();};
$('yerlestir').onclick=function(){yerlesim();sigdir();};
function noronEkle(d){var L_=S.length-1;if(secKatman<1||secKatman>=L_)secKatman=1;var y=S[secKatman]+d;if(y<2||y>64)return;var eW=W.slice(),eB=B.slice(),eS=S.slice();S[secKatman]=y;kur(eW,eB,eS);yapiDegisti(false);}
function katmanEkle(){if(S.length>8)return;var yer=Math.max(1,secKatman)+1;S.splice(yer,0,16);ACT.splice(yer,0,'ReLU');secKatman=yer;kur();sifirla(false);}
function katmanSil(){var L_=S.length-1;if(L_<=2)return;var k=Math.min(Math.max(1,secKatman),L_-1);S.splice(k,1);ACT.splice(k,1);secKatman=Math.max(1,k-1);kur();sifirla(false);}
$('ekle').onclick=function(){noronEkle(1);};$('sil').onclick=function(){noronEkle(-1);};$('katEkle').onclick=katmanEkle;$('katSil').onclick=katmanSil;
$('sifir').onclick=function(){kur();sifirla(true);};
document.addEventListener('keydown',function(e){if(e.target.tagName==='INPUT'||e.target.closest('.dil'))return;var k=e.key.toLowerCase();
  if(k==='n')noronEkle(1);else if(k==='d')noronEkle(-1);else if(k==='l')katmanEkle();else if(k==='k')katmanSil();else if(k==='r'){yerlesim();sigdir();}});
function yapiDegisti(a){if(a)kur(W.slice(),B.slice(),S.slice());yerlesim();egitiliyor=true;HEDEF=adim+5000;dogr=null;durum();}
function sifirla(tam){if(tam)adim=0;kayipEma=null;dogr=null;egitiliyor=true;HEDEF=adim+9000;yerlesim();sigdir();durum();}
function durum(){var t=0;for(var l=0;l<S.length;l++)t+=S[l];$('toplam').textContent='('+L('noron')+': '+t+')';
  $('durum').innerHTML=kacis(L('adim'))+' <b>'+adim.toLocaleString(LANG)+'</b> · '+kacis(L('hata'))+' <b>'+(kayipEma==null?'–':kayipEma.toFixed(4))+'</b> · '+kacis(L('dogru'))+' <b>'+(dogr==null?'–':Math.round(dogr*100)+'%')+'</b>'+(egitiliyor?' · <i>'+kacis(L('egit'))+'</i>':'')+' · '+kacis(L('secili'))+': '+secKatman;}

// ---------- dil ----------
var dilM=$('dilM'),dilB=$('dilB');
LANGS.forEach(function(l){var b=el('button');b.type='button';b.setAttribute('role','menuitemradio');b.setAttribute('data-lang',l);b.lang=l;
  var k=el('b',null,l.toUpperCase());b.appendChild(k);b.appendChild(el('span',null,ADLAR[l]));
  b.onclick=function(){LANG=l;try{localStorage.setItem('ozmira-site-dil',l);}catch(_){}dilKapat(true);dilUygula();};dilM.appendChild(b);});
function dilAc(){dilM.hidden=false;dilB.setAttribute('aria-expanded','true');var s=dilM.querySelector('[aria-checked=true]')||dilM.firstChild;s.focus();}
function dilKapat(odak){dilM.hidden=true;dilB.setAttribute('aria-expanded','false');if(odak)dilB.focus();}
dilB.onclick=function(){dilM.hidden?dilAc():dilKapat(false);};
document.addEventListener('click',function(e){if(!dilM.hidden&&!e.target.closest('#dil'))dilKapat(false);});
dilM.addEventListener('keydown',function(e){var bs=[].slice.call(dilM.children),i=bs.indexOf(document.activeElement);
  if(e.key==='Escape'){e.preventDefault();dilKapat(true);}else if(e.key==='ArrowDown'){e.preventDefault();bs[(i+1)%bs.length].focus();}else if(e.key==='ArrowUp'){e.preventDefault();bs[(i-1+bs.length)%bs.length].focus();}});
function dilUygula(){
  document.documentElement.lang=LANG;document.documentElement.dir=LANG==='ar'?'rtl':'ltr';
  [].forEach.call(document.querySelectorAll('[data-l]'),function(e){e.textContent=L(e.getAttribute('data-l'));});
  [].forEach.call(document.querySelectorAll('[data-lph]'),function(e){e.placeholder=L(e.getAttribute('data-lph'));});
  [].forEach.call(document.querySelectorAll('[data-lal]'),function(e){e.setAttribute('aria-label',L(e.getAttribute('data-lal')));});
  document.title=L('title')+' · OZMIRA';var md=document.querySelector('meta[name=description]');if(md)md.content=L('desc');
  document.querySelector('.geri').textContent=(LANG==='ar'?'→ ':'← ')+L('geri');
  $('dilKod').textContent=LANG.toUpperCase();
  [].forEach.call(dilM.children,function(b){b.setAttribute('aria-checked',b.getAttribute('data-lang')===LANG);});
  if(hazirNo>=0)$('gorevAd').value=gorevAdi();
  formu();kararPanel();durum();ciz();
}

// ---------- döngü ----------
var t0=performance.now(),son=t0,sonKayit=0,sayac=0;
function kare(now){
  var t=(now-t0)/1000,dt=Math.min(.1,(now-son)/1000);son=now;
  if(egitiliyor){for(var k=0;k<5;k++){var ls=egitAdim();kayipEma=kayipEma==null?ls:kayipEma*.97+ls*.03;}if(adim%100<5)dogr=dogruluk();if(adim>=HEDEF){egitiliyor=false;dogr=dogruluk();}}
  if(calis){for(var s=0;s<NS;s++){var hz=SIS[s].hiz;for(var w=isler[s].length-1;w>=0;w--){var is=isler[s][w];is.ilerleme+=dt*(.015+.035*hz)/(.5+is.yuk)/(w===0?1:3);if(is.ilerleme>=1)isler[s].splice(w,1);}}}
  xSimdi=canli?canliGirdi(t):girdi(gorev,doluluk());
  if(now-sonKayit>45){sonKayit=now;for(var i=0;i<NIN;i++)gecmis[i][gecmisUc]=xSimdi[i];gecmisUc=(gecmisUc+1)%GECMIS;}
  akt=ileri(xSimdi);if(gizli&&(sayac%6===0||!J))J=etkiHesapla(xSimdi);
  if(sayac%8===0){kararPanel();durum();}
  ciz();sayac++;requestAnimationFrame(kare);
}
kur();for(var on=0;on<600;on++){var l0=egitAdim();kayipEma=kayipEma==null?l0:kayipEma*.97+l0*.03;}dogr=dogruluk();
for(var gh=0;gh<GECMIS;gh++)for(var ii=0;ii<NIN;ii++)gecmis[ii][gh]=xSimdi[ii];
$('gorevAd').value=gorevAdi();
boyutla();yerlesim();sigdir();akt=ileri(xSimdi);dilUygula();
if(window.ResizeObserver)new ResizeObserver(function(){boyutla();sigdir();}).observe(cv);
window.addEventListener('resize',function(){boyutla();sigdir();});
requestAnimationFrame(kare);
})();
</script>
